<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    >

    <meta name="theme-color" content="#050505">

    <meta
        name="description"
        content="TIME — زمان در حال گذر است."
    >

    <title>TIME</title>
    
<link rel="icon" type="image/png" href="icon-512.png">
<link rel="manifest" href="manifest.json">
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main class="time-page">

        <div class="background-glow"></div>

        <section class="countdown-container">

            <div class="brand">
                <span>TIME</span>
            </div>

            <div class="mystery-line">
                زمان در حال گذر است.
            </div>

            <div class="countdown" id="countdown">

                <div class="time-unit">
                    <span id="years">--</span>
                    <small>سال</small>
                </div>

                <div class="separator">:</div>

                <div class="time-unit">
                    <span id="months">--</span>
                    <small>ماه</small>
                </div>

                <div class="separator">:</div>

                <div class="time-unit">
                    <span id="days">--</span>
                    <small>روز</small>
                </div>

                <div class="separator">:</div>

                <div class="time-unit">
                    <span id="hours">--</span>
                    <small>ساعت</small>
                </div>

                <div class="separator">:</div>

                <div class="time-unit">
                    <span id="minutes">--</span>
                    <small>دقیقه</small>
                </div>

                <div class="separator">:</div>

                <div class="time-unit seconds-unit">
                    <span id="seconds">--</span>
                    <small>ثانیه</small>
                </div>

            </div>

            <div class="mystery-message" id="mysteryMessage">
                هر ثانیه مهم است.
            </div>

        </section>

        <footer class="footer">
            <span>●</span>
            <span>TIME</span>
        </footer>

    </main>

    <script src="script.js"></script>

</body>
</html>
