<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    >

    <meta name="theme-color" content="#050505">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta
        name="apple-mobile-web-app-status-bar-style"
        content="black-translucent"
    >

    <meta
        name="description"
        content="TIME — زمان در حال گذر است."
    >

    <title>TIME</title>

    <link rel="icon" type="image/png" href="icon-512.png">
    <link rel="apple-touch-icon" href="icon-512.png">
    <link rel="manifest" href="manifest.json">

    <link rel="stylesheet" href="style.css">
</head>

<body>

<!-- CINEMATIC INTRO -->
<div class="time-intro" id="timeIntro">

    <div class="intro-content">

        <div class="intro-logo">
            TIME
        </div>

        <div class="intro-line"></div>

        <div class="intro-text">
            زمان در حال گذر است.
        </div>

        <div class="intro-subtitle">
            EVERY SECOND MATTERS
        </div>

    </div>

</div>
    
    <main class="time-page">

        <div class="background-glow"></div>

        <div class="ambient-line ambient-line-one"></div>
        <div class="ambient-line ambient-line-two"></div>

        <section class="countdown-container">

            <div class="brand" aria-label="TIME">
                <span>TIME</span>
            </div>

            <div class="mystery-line">
                زمان در حال گذر است.
            </div>

            <div
                class="countdown"
                id="countdown"
                aria-label="شمارش معکوس"
            >

                <div class="time-unit">
                    <span id="years">--</span>
                    <small>سال</small>
                </div>

                <div class="separator">:</div>

                <div class="time-unit">
                    <span id="months">--</span>
                    <small>ماه</small>
                </div>

                <div class="separator">:</div>

                <div class="time-unit">
                    <span id="days">--</span>
                    <small>روز</small>
                </div>

                <div class="separator">:</div>

                <div class="time-unit">
                    <span id="hours">--</span>
                    <small>ساعت</small>
                </div>

                <div class="separator">:</div>

                <div class="time-unit">
                    <span id="minutes">--</span>
                    <small>دقیقه</small>
                </div>

                <div class="separator">:</div>

                <div class="time-unit seconds-unit">
                    <span id="seconds">--</span>
                    <small>ثانیه</small>
                </div>

            </div>

            <div
                class="mystery-message"
                id="mysteryMessage"
            >
                هر ثانیه مهم است.
            </div>

            <div class="time-meta">

    <div class="meta-item">
        <span class="meta-label">SYSTEM</span>
        <span class="meta-value">
            <span class="system-dot"></span>
            ACTIVE
        </span>
    </div>

    <div class="meta-divider"></div>

    <div class="meta-item">
        <span class="meta-label">LOCAL TIME</span>
        <span
            class="meta-value clock"
            id="localClock"
        >
            --:--:--
        </span>
    </div>

</div>
            

        </section>

        <footer class="footer">
            <span class="status-dot">●</span>
            <span>TIME</span>
        </footer>

    </main>

    <script src="script.js"></script>

</body>
</html>
